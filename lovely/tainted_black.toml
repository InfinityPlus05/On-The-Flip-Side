[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# selling card
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "G.CONTROLLER:recall_cardarea_focus(area == G.jokers and 'jokers' or 'consumeables')"
position = "after"
match_indent = true
payload = '''
  SMODS.calculate_context({
    OTFS = {
      tainted_black_check = true
    }
  })
'''

# copy card
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "return new_card"
position = "before"
match_indent = true
payload = '''
  SMODS.calculate_context({
    OTFS = {
      tainted_black_check = true
    }
  })
'''

# create card
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if not SMODS.bypass_create_card_edition and not card.edition then"
position = "before"
match_indent = true
payload = '''
  SMODS.calculate_context({
    OTFS = {
      tainted_black_check = true
    }
  })
'''

# destroy card
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
G.E_MANAGER:add_event(Event({
        trigger = 'after',
        blockable = false,
        delay =  1.051*dissolve_time,
    }))
'''
position = "after"
match_indent = true
payload = '''
  SMODS.calculate_context({
    OTFS = {
      tainted_black_check = true
    }
  })
'''

