[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# subtract interest
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "dollars = dollars + G.GAME.interest_amount*math.min(math.floor(G.GAME.dollars/5), G.GAME.interest_cap/5)"
position = "before"
match_indent = true
payload = '''
if G.GAME.modifiers.otfs_negative_interest then
  dollars = dollars - G.GAME.interest_amount*math.min(math.floor(G.GAME.dollars/5), G.GAME.interest_cap/5)
else
'''
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "dollars = dollars + G.GAME.interest_amount*math.min(math.floor(G.GAME.dollars/5), G.GAME.interest_cap/5)"
position = "after"
match_indent = true
payload = '''
end
'''

# modify displayed interest on cashout
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "add_round_eval_row({bonus = true, name='interest', pitch = pitch, dollars = G.GAME.interest_amount*math.min(math.floor(G.GAME.dollars/5), G.GAME.interest_cap/5)})"
position = "before"
match_indent = true
payload = '''
if G.GAME.modifiers.otfs_negative_interest then
  add_round_eval_row({bonus = true, name='interest', pitch = pitch, dollars = -1 * G.GAME.interest_amount*math.min(math.floor(G.GAME.dollars/5), G.GAME.interest_cap/5)})
else
'''
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "add_round_eval_row({bonus = true, name='interest', pitch = pitch, dollars = G.GAME.interest_amount*math.min(math.floor(G.GAME.dollars/5), G.GAME.interest_cap/5)})"
position = "after"
match_indent = true
payload = '''
end
'''

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "table.insert(left_text,{n=G.UIT.O, config={object = DynaText({string = {\" \"..localize{type = 'variable', key = 'interest', vars = {G.GAME.interest_amount, 5, G.GAME.interest_amount*G.GAME.interest_cap/5}}}, colours = {G.C.UI.TEXT_LIGHT}, shadow = true, pop_in = 0, scale = 0.4*scale, silent = true})}})"
position = "at"
match_indent = true
payload = '''
table.insert(left_text,{n=G.UIT.O, config={object = DynaText({string = {" "..localize{type = 'variable', key = 'interest', 
vars = {G.GAME.modifiers.otfs_negative_interest and (-1 * G.GAME.interest_amount) or G.GAME.interest_amount, 5, G.GAME.interest_amount*G.GAME.interest_cap/5}}}, colours = {G.C.UI.TEXT_LIGHT}, shadow = true, pop_in = 0, scale = 0.4*scale, silent = true})}})
'''